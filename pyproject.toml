[project]
name = "tileforge"
version = "0.1.0"
description = "A diffusion model trained from scratch that generates seamless game textures and tile maps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
